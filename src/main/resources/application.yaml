spring:
  application.name: RecipeFinder
  ai:
    # AI provider configuration
    openai:
      chat:
        model: gpt-6-sol
        reasoning-effort: none
        temperature: 1.0
      image:
        model: gpt-image-2.5-flare
        size: 1024x1024
      api-key: ${OPENAI_API_KEY}

    vectorstore.redis.initialize-schema: true

    # Logging
    chat.client.observations:
      log-prompt: true
      log-completion: true
      include-error-logging: true
    image.observations.log-prompt: true
    vectorstore.observations.log-query-response: true

# Required for PDF upload
  servlet.multipart:
    max-file-size: 100MB
    max-request-size: 100MB

server.tomcat.max-swallow-size: -1

# VectorStore configuration
spring.data.redis:
  # Spring AI's Redis vector store requires Jedis, but Lettuce is also on the classpath and preferred by default
  client-type: jedis
  host: localhost
  port: 6379
  username:
  password:

app:
  available-ingredients-in-fridge: bacon,onions
